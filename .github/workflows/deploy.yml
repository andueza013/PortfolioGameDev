name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ] # Cambia a 'master' si tu rama se llama así

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Forzar el uso de Node.js 22 (o la versión que requiera tu Astro)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm' # Usa 'pnpm' o 'yarn' si no usas npm

      # 2. Instalar dependencias
      - name: Install dependencies
        run: npm ci

      # 3. Compilar el proyecto Astro
      - name: Build site
        run: npm run build

      # 4. Preparar artefactos para GitHub Pages
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4